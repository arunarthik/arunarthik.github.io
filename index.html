<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terugu Arun | AI Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        }
                    },
                    fontFamily: { sans: ['Inter'], serif: ['Playfair Display'] }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-white font-sans transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // Paste your Gemini API Key directly inside these quotes
        const GEMINI_API_KEY = "AIzaSyD_dXC1neChXjvSMCYEEMi0vBIa5ZYdp_A"; 

        // SVG Icons
        const BotIcon = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>;
        const UserIcon = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const ChatIcon = ({size=24}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
        const CloseIcon = ({size=24}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
        const SendIcon = ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>;

        const App = () => {
            const [isChatOpen, setIsChatOpen] = useState(false);
            const [messages, setMessages] = useState([
                { id: "welcome", role: "model", text: "Hi! I'm an AI assistant trained on Arun's resume. Ask me anything about his experience, skills, or projects!" }
            ]);
            const [input, setInput] = useState("");
            const [isTyping, setIsTyping] = useState(false);
            const messagesEndRef = useRef(null);

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages, isChatOpen]);

            const handleSend = async () => {
                if (!input.trim() || isTyping) return;

                const userMessage = { id: Date.now().toString(), role: "user", text: input };
                setMessages(prev => [...prev, userMessage]);
                setInput("");
                setIsTyping(true);

                try {
                    // Direct fetch request to the stable Google Gemini endpoint
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, { 
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ 
                                parts: [{ 
                                    text: `You are a professional portfolio AI assistant for Terugu Arun. Arun is a Software Developer specializing in Python, FastAPI, and React. He has experience working at Tata Consultancy Services in clinical trial data systems. Highlight his skills if asked. Keep your answer brief and natural. User asks: ${userMessage.text}` 
                                }] 
                            }]
                        })
                    });

                    const data = await response.json();
                    
                    if (data.error) {
                        throw new Error(data.error.message);
                    }

                    const botReply = data.candidates[0].content.parts[0].text;
                    setMessages(prev => [...prev, { id: (Date.now()+1).toString(), role: "model", text: botReply }]);
                } catch (error) {
                    setMessages(prev => [...prev, { id: (Date.now()+1).toString(), role: "model", text: `API Error: ${error.message}. Double check your API key implementation.` }]);
                } finally {
                    setIsTyping(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4">
                    <h1 className="text-4xl font-serif font-bold text-center text-primary-500 mb-2">Terugu Arun | AI Portfolio</h1>
                    <p className="text-gray-400 mb-8">Click the floating chat icon in the bottom right corner to test the direct Gemini integration.</p>

                    {/* Floating Toggle Button */}
                    <button 
                        onClick={() => setIsChatOpen(!isChatOpen)}
                        className="fixed bottom-6 right-6 p-4 bg-primary-600 text-white rounded-full shadow-lg hover:bg-primary-700 transition-all z-50 hover:scale-110 active:scale-95"
                    >
                        {isChatOpen ? <CloseIcon size={24} /> : <ChatIcon size={24} />}
                    </button>

                    {/* Chat Window Popup */}
                    {isChatOpen && (
                        <div className="fixed bottom-24 right-6 w-80 md:w-96 bg-gray-800 rounded-2xl shadow-2xl border border-gray-700 overflow-hidden flex flex-col z-50 h-[500px]">
                            {/* Header */}
                            <div className="p-4 bg-primary-600 text-white flex items-center justify-between">
                                <h3 className="font-semibold flex items-center gap-2">
                                    <BotIcon size={20} />
                                    <span>AI Assistant</span>
                                </h3>
                                <button onClick={() => setIsChatOpen(false)} className="text-white/80 hover:text-white">
                                    <CloseIcon size={18} />
                                </button>
                            </div>

                            {/* Chat body */}
                            <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-900/50 text-gray-200">
                                {messages.map(msg => (
                                    <div key={msg.id} className={`flex gap-3 ${msg.role === "user" ? "flex-row-reverse" : ""}`}>
                                        <div className={`w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ${msg.role === "user" ? "bg-indigo-900 text-indigo-300" : "bg-primary-900 text-primary-300"}`}>
                                            {msg.role === "user" ? <UserIcon size={16} /> : <BotIcon size={16} />}
                                        </div>
                                        <div className={`max-w-[80%] rounded-2xl px-4 py-2 text-sm shadow-sm ${msg.role === "user" ? "bg-primary-600 text-white rounded-br-none" : "bg-gray-700 text-gray-100 rounded-bl-none border border-gray-600"}`}>
                                            {msg.text}
                                        </div>
                                    </div>
                                ))}
                                {isTyping && (
                                    <div className="flex gap-3">
                                        <div className="w-8 h-8 rounded-full bg-primary-900 text-primary-300 flex items-center justify-center flex-shrink-0">
                                            <BotIcon size={16} />
                                        </div>
                                        <div className="text-xs text-gray-500 animate-pulse mt-2">AI is generating response...</div>
                                    </div>
                                )}
                                <div ref={messagesEndRef} />
                            </div>

                            {/* Input Footer */}
                            <div className="p-4 bg-gray-800 border-t border-gray-700">
                                <div className="flex gap-2">
                                    <input 
                                        type="text"
                                        value={input}
                                        onChange={e => setInput(e.target.value)}
                                        onKeyDown={e => e.key === 'Enter' && handleSend()}
                                        placeholder="Ask about Arun's experience..."
                                        className="flex-1 bg-gray-900 text-white border border-gray-700 rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"
                                        disabled={isTyping}
                                    />
                                    <button 
                                        onClick={handleSend}
                                        disabled={isTyping || !input.trim()}
                                        className="p-2 bg-primary-600 text-white rounded-full hover:bg-primary-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                                    >
                                        <SendIcon size={18} />
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
